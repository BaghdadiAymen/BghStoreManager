<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - {{ store_name }}</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-bottom: 20px; color: #2563eb; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .error { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>📱 {{ store_name }}</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin or seller">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button onclick="doLogin()">Login</button>
        <div id="error" class="error"></div>
    </div>

    <script>
        function doLogin() {
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/';
                } else {
                    document.getElementById('error').innerText = data.message;
                }
            });
        }
    </script>
</body>
</html>
